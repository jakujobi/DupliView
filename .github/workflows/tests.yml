name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests
        shell: pwsh
        run: |
          Invoke-Pester -Script .\tests\DupliView.Tests.ps1
